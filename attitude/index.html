<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AORA Attitude</title>
<style>
  :root {
    --bg: #0a0e12;
    --card: #12181f;
    --text: #e8f0f5;
    --muted: #8aa0b0;
    --accent: #f2c14e;
    --danger: #e36a2c;
    --ok: #8eae62;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 8px;
    -webkit-user-select: none;
    user-select: none;
  }
  .brand {
    text-align: center;
    margin-bottom: 6px;
  }
  .brand a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 1.5px;
  }
  .brand small {
    display: block;
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-top: 1px;
  }
  h1 { text-align: center; font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; color: var(--accent); letter-spacing: 0.3px; }
  .ver { text-align: center; font-size: 0.5rem; color: var(--muted); margin-bottom: 6px; }
  .gauges { display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px; gap: 4px; }
  .gauge-wrap { text-align: center; flex: 1; }
  .gauge-label { font-size: 0.65rem; color: var(--accent); letter-spacing: 0.8px; margin-top: 2px; font-weight: 600; }
  svg.gauge { width: 100%; max-width: 160px; height: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .card { background: var(--card); border-radius: 8px; padding: 6px 4px; text-align: center; }
  .label { font-size: 0.55rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1px; }
  .value { font-size: 1.35rem; font-weight: 700; line-height: 1; }
  .unit { font-size: 0.55rem; color: var(--muted); margin-top: 0; }
  .max { font-size: 0.6rem; color: var(--accent); margin-top: 2px; }
  button { width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 600; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 0.3px; }
  button:active { transform: scale(0.98); }
  .status { text-align: center; font-size: 0.65rem; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .perm-btn { background: var(--ok); margin-bottom: 6px; }
  .shot-btn { background: #2a3a4a; margin-top: 6px; }
  .hidden { display: none; }
  .socials {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 14px;
    padding-bottom: 8px;
  }
  .socials a {
    color: var(--accent);
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 0.55rem;
    gap: 3px;
  }
  .socials svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }
</style>
</head>
<body>
  <div class="brand">
    <a href="https://www.australianoffroadacademy.com.au" target="_blank">AORA</a>
    <small>Australian Offroad Academy</small>
  </div>
  <h1>ATTITUDE</h1>
  <div class="ver">v13 · AORA branding</div>

  <button id="permBtn" class="perm-btn">Enable Sensors</button>

  <div class="gauges">
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 120 100" id="pitchGauge">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f2c14e"/>
            <stop offset="100%" stop-color="#e36a2c"/>
          </linearGradient>
        </defs>
        <path d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
        <path id="pitchArc" d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="125" stroke-dashoffset="62"/>
        <g id="pitchIcon" transform="translate(60,58)">
          <g transform="rotate(0)" fill="none" stroke="#f2c14e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-22 3 L-20 -2 L-16 -8 L-6 -10 L12 -10 L16 -7 L18 -3 L18 3 L-22 3 Z"/>
            <path d="M-14 0 L-10 -7 L2 -7 L6 -3"/>
            <path d="M14 -3 L16 1"/>
            <circle cx="-14" cy="4" r="6"/>
            <circle cx="10" cy="4" r="6"/>
            <circle cx="-14" cy="4" r="2.5" fill="#f2c14e" stroke="none"/>
            <circle cx="10" cy="4" r="2.5" fill="#f2c14e" stroke="none"/>
            <path d="M16 1 L18 3"/>
          </g>
        </g>
        <text x="60" y="92" text-anchor="middle" font-size="10" fill="#f2c14e" id="pitchVal">0°</text>
      </svg>
      <div class="gauge-label">PITCHING</div>
    </div>
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 120 100" id="rollGauge">
        <path d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
        <path id="rollArc" d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="125" stroke-dashoffset="62"/>
        <g id="rollIcon" transform="translate(60,56)">
          <g transform="rotate(0)" fill="none" stroke="#f2c14e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-14 4 L-12 -2 L-8 -9 L8 -9 L12 -2 L14 4 Z"/>
            <path d="M-10 0 L-6 -7 L6 -7 L10 0"/>
            <circle cx="0" cy="-1" r="4"/>
            <rect x="-14" y="2" width="5" height="8" rx="1"/>
            <rect x="9" y="2" width="5" height="8" rx="1"/>
            <path d="M-4 3 L4 3"/>
          </g>
        </g>
        <text x="60" y="92" text-anchor="middle" font-size="10" fill="#f2c14e" id="rollVal">0°</text>
      </svg>
      <div class="gauge-label">ROLLING</div>
    </div>
  </div>

  <div class="grid3">
    <div class="card"><div class="label">Pitch + max</div><div class="value" id="maxPitchPos">0</div><div class="unit">°</div></div>
    <div class="card"><div class="label">Pitch - max</div><div class="value" id="maxPitchNeg">0</div><div class="unit">°</div></div>
    <div class="card"><div class="label">Roll max</div><div class="value" id="maxRoll">0</div><div class="unit">°</div></div>
  </div>
  <div class="grid">
    <div class="card"><div class="label">Speed</div><div class="value" id="speed">0</div><div class="unit">km/h</div><div class="max" id="maxSpeed">max 0</div></div>
    <div class="card"><div class="label">Distance</div><div class="value" id="distance">0</div><div class="unit">km</div></div>
  </div>
  <div class="grid">
    <div class="card"><div class="label">Altitude</div><div class="value" id="altitude">0</div><div class="unit">m</div></div>
    <div class="card"><div class="label">Ascent rate</div><div class="value" id="ascentRate">0</div><div class="unit">m/min</div></div>
  </div>
  <div class="grid">
    <div class="card"><div class="label">Total climb</div><div class="value" id="totalClimb">0</div><div class="unit">m</div></div>
    <div class="card"><div class="label">Total descent</div><div class="value" id="totalDescent">0</div><div class="unit">m</div></div>
  </div>

  <button id="resetBtn">Reset / Calibrate</button>
  <button id="shotBtn" class="shot-btn">Save Screenshot</button>
  <div class="status" id="status">Tap Enable Sensors to start</div>

  <div class="socials">
    <a href="https://www.facebook.com/AustralianOffroadAcademy/" target="_blank" title="Facebook">
      <svg viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c4.56-.93 8-4.96 8-9.95z"/></svg>
      Facebook
    </a>
    <a href="https://www.instagram.com/australian_offroad_academy/" target="_blank" title="Instagram">
      <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      Instagram

    <a href="https://www.youtube.com/c/AustralianoffroadacademyAu" target="_blank" title="YouTube">
      <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      Website
    </a>
  </div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let maxPitchPos = 0, maxPitchNeg = 0, maxRoll = 0, maxSpeed = 0, totalDistance = 0, lastPos = null, watchId = null;
let calPitch = 0, calRoll = 0, rawPitch = 0, rawRoll = 0, hasMotion = false, currentSpeed = 0;
let currentAltitude = 0, ascentRate = 0, totalClimb = 0, totalDescent = 0, lastAltitude = null, lastAltTime = null, lastUIUpdate = 0;

function format(n) { if (n == null || isNaN(n)) return '0'; return Math.round(n).toString(); }
function getDisplayed() { return { pitch: hasMotion ? (rawPitch - calPitch) : 0, roll: hasMotion ? (rawRoll - calRoll) : 0 }; }

function updateGauge(type, deg) {
  const clamped = Math.max(-45, Math.min(45, deg));
  const icon = $(type + 'Icon');
  if (icon) icon.setAttribute('transform', `translate(60,${type==='pitch'?58:56}) rotate(${clamped})`);
  const val = $(type + 'Val');
  if (val) val.textContent = format(deg) + '°';
  const arc = $(type + 'Arc');
  if (arc) arc.setAttribute('stroke-dashoffset', 62 - (clamped / 45) * 30);
}

function updateUI() {
  const d = getDisplayed();
  updateGauge('pitch', d.pitch);
  updateGauge('roll', d.roll);
  $('maxPitchPos').textContent = format(maxPitchPos);
  $('maxPitchNeg').textContent = format(Math.abs(maxPitchNeg));
  $('maxRoll').textContent = format(maxRoll);
  $('speed').textContent = format(currentSpeed);
  $('maxSpeed').textContent = 'max ' + format(maxSpeed);
  $('distance').textContent = format(totalDistance / 1000);
  $('altitude').textContent = format(currentAltitude);
  $('ascentRate').textContent = format(ascentRate);
  $('totalClimb').textContent = format(totalClimb);
  $('totalDescent').textContent = format(totalDescent);
}

function maybeUpdateUI() {
  const now = Date.now();
  if (now - lastUIUpdate >= 1000) { lastUIUpdate = now; updateUI(); }
}

function onMotion(e) {
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;
  const x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
  rawPitch = Math.atan2(y, z) * (180 / Math.PI);
  rawRoll  = Math.atan2(-x, Math.sqrt(y * y + z * z)) * (180 / Math.PI);
  hasMotion = true;
  const d = getDisplayed();
  if (d.pitch > 0) maxPitchPos = Math.max(maxPitchPos, d.pitch);
  if (d.pitch < 0) maxPitchNeg = Math.min(maxPitchNeg, d.pitch);
  maxRoll = Math.max(maxRoll, Math.abs(d.roll));
  maybeUpdateUI();
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function onPosition(pos) {
  const c = pos.coords, now = pos.timestamp || Date.now();
  currentSpeed = (c.speed != null && c.speed >= 0) ? c.speed * 3.6 : 0;
  if (currentSpeed) maxSpeed = Math.max(maxSpeed, currentSpeed);
  if (lastPos && c.accuracy < 50) {
    const dist = haversine(lastPos.latitude, lastPos.longitude, c.latitude, c.longitude);
    if (dist > 1 && dist < 200) totalDistance += dist;
  }
  lastPos = { latitude: c.latitude, longitude: c.longitude };
  if (c.altitude != null && (c.altitudeAccuracy == null || c.altitudeAccuracy < 30)) {
    currentAltitude = c.altitude;
    if (lastAltitude != null && lastAltTime != null) {
      const dt = (now - lastAltTime) / 1000, dAlt = currentAltitude - lastAltitude;
      if (dt > 0.5 && Math.abs(dAlt) > 0.5) {
        ascentRate = (dAlt / dt) * 60;
        if (dAlt > 1) totalClimb += dAlt;
        else if (dAlt < -1) totalDescent += Math.abs(dAlt);
      }
    }
    lastAltitude = currentAltitude;
    lastAltTime = now;
  }
  maybeUpdateUI();
  $('status').textContent = 'GPS active • accuracy ' + Math.round(c.accuracy) + 'm' + (c.altitude != null ? ' • alt ' + Math.round(c.altitude) + 'm' : '');
}

function onPosError(err) { $('status').textContent = 'GPS: ' + err.message; }

async function enableSensors() {
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm !== 'granted') { $('status').textContent = 'Motion permission denied'; return; }
    } catch (e) { $('status').textContent = 'Motion permission error'; return; }
  }
  window.addEventListener('devicemotion', onMotion, true);
  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(onPosition, onPosError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  } else { $('status').textContent = 'Geolocation not supported'; }
  $('permBtn').classList.add('hidden');
  $('status').textContent = 'Hold still, then tap Reset / Calibrate to set zero';
}

function resetAll() {
  if (hasMotion) { calPitch = rawPitch; calRoll = rawRoll; } else { calPitch = calRoll = 0; }
  maxPitchPos = 0; maxPitchNeg = 0; maxRoll = 0; maxSpeed = 0; totalDistance = 0; lastPos = null; currentSpeed = 0;
  totalClimb = 0; totalDescent = 0; ascentRate = 0; lastAltitude = currentAltitude; lastAltTime = Date.now();
  lastUIUpdate = 0; updateUI();
  $('status').textContent = hasMotion ? 'Calibrated • variation from this point • climb/descent reset' : 'No motion data yet — enable sensors first';
}

async function saveScreenshot() {
  $('status').textContent = 'Capturing…';
  try {
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#0a0e12',
      scale: 2,
      useCORS: true
    });
    const link = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    link.download = `aora-attitude-${stamp}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    $('status').textContent = 'Screenshot saved';
  } catch (e) {
    $('status').textContent = 'Screenshot failed';
    console.error(e);
  }
}

$('permBtn').addEventListener('click', enableSensors);
$('resetBtn').addEventListener('click', resetAll);
$('shotBtn').addEventListener('click', saveScreenshot);
updateUI();
</script>
</body>
</html>
