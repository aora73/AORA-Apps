<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offroad Attitude & Speed</title>
<style>
  :root {
    --bg: #0a0e12;
    --card: #12181f;
    --text: #e8f0f5;
    --muted: #8aa0b0;
    --accent: #f2c14e;
    --danger: #e36a2c;
    --ok: #8eae62;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 11px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 3px;
    color: var(--accent);
    letter-spacing: 0.4px;
  }
  .ver { text-align: center; font-size: 0.6rem; color: var(--muted); margin-bottom: 8px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 12px;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
  }
  .label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-bottom: 3px;
  }
  .value {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }
  .unit {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 1px;
  }
  .max {
    font-size: 0.72rem;
    color: var(--accent);
    margin-top: 5px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 0.95rem;
    font-weight: 600;
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.4px;
  }
  button:active { transform: scale(0.98); }
  .status {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 7px;
    min-height: 1.1em;
  }
  .perm-btn { background: var(--ok); margin-bottom: 9px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>OFFROAD ATTITUDE</h1>
  <div class="ver">v4 · pitch & roll</div>

  <button id="permBtn" class="perm-btn">Enable Sensors</button>

  <div class="grid">
    <div class="card">
      <div class="label">Pitch</div>
      <div class="value" id="pitch">0</div>
      <div class="unit">°</div>
      <div class="max" id="maxPitch">max 0</div>
    </div>
    <div class="card">
      <div class="label">Roll</div>
      <div class="value" id="roll">0</div>
      <div class="unit">°</div>
      <div class="max" id="maxRoll">max 0</div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <div class="label">Speed</div>
      <div class="value" id="speed">0</div>
      <div class="unit">km/h</div>
      <div class="max" id="maxSpeed">max 0</div>
    </div>
    <div class="card">
      <div class="label">Distance</div>
      <div class="value" id="distance">0</div>
      <div class="unit">km</div>
      <div class="max">total</div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <div class="label">Altitude</div>
      <div class="value" id="altitude">0</div>
      <div class="unit">m</div>
      <div class="max">current</div>
    </div>
    <div class="card">
      <div class="label">Ascent rate</div>
      <div class="value" id="ascentRate">0</div>
      <div class="unit">m/min</div>
      <div class="max">vertical</div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <div class="label">Total climb</div>
      <div class="value" id="totalClimb">0</div>
      <div class="unit">m</div>
      <div class="max">up</div>
    </div>
    <div class="card">
      <div class="label">Total descent</div>
      <div class="value" id="totalDescent">0</div>
      <div class="unit">m</div>
      <div class="max">down</div>
    </div>
  </div>

  <button id="resetBtn">Reset / Calibrate</button>
  <div class="status" id="status">Tap Enable Sensors to start</div>

<script>
const $ = id => document.getElementById(id);

let maxPitch = 0, maxRoll = 0;
let maxSpeed = 0;
let totalDistance = 0;
let lastPos = null;
let watchId = null;

let calPitch = 0, calRoll = 0;
let rawPitch = 0, rawRoll = 0;
let hasOrientation = false;
let currentSpeed = 0;

let currentAltitude = 0;
let ascentRate = 0;
let totalClimb = 0;
let totalDescent = 0;
let lastAltitude = null;
let lastAltTime = null;

function format(n) {
  if (n == null || isNaN(n)) return '0';
  return Math.round(n).toString();
}

function getDisplayed() {
  return {
    pitch: hasOrientation ? (rawPitch - calPitch) : 0,
    roll: hasOrientation ? (rawRoll - calRoll) : 0
  };
}

function updateUI() {
  const d = getDisplayed();
  $('pitch').textContent = format(d.pitch);
  $('roll').textContent = format(d.roll);
  $('maxPitch').textContent = 'max ' + format(maxPitch);
  $('maxRoll').textContent = 'max ' + format(maxRoll);
  $('speed').textContent = format(currentSpeed);
  $('maxSpeed').textContent = 'max ' + format(maxSpeed);
  $('distance').textContent = format(totalDistance / 1000);
  $('altitude').textContent = format(currentAltitude);
  $('ascentRate').textContent = format(ascentRate);
  $('totalClimb').textContent = format(totalClimb);
  $('totalDescent').textContent = format(totalDescent);
}

function onOrientation(e) {
  if (e.beta != null) rawPitch = e.beta;
  if (e.gamma != null) rawRoll = e.gamma;
  hasOrientation = true;

  const d = getDisplayed();
  maxPitch = Math.max(maxPitch, Math.abs(d.pitch));
  maxRoll = Math.max(maxRoll, Math.abs(d.roll));

  updateUI();
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function onPosition(pos) {
  const c = pos.coords;
  const now = pos.timestamp || Date.now();

  currentSpeed = (c.speed != null && c.speed >= 0) ? c.speed * 3.6 : 0;
  if (currentSpeed) maxSpeed = Math.max(maxSpeed, currentSpeed);

  if (lastPos && c.accuracy < 50) {
    const dist = haversine(lastPos.latitude, lastPos.longitude, c.latitude, c.longitude);
    if (dist > 1 && dist < 200) totalDistance += dist;
  }
  lastPos = { latitude: c.latitude, longitude: c.longitude };

  if (c.altitude != null && (c.altitudeAccuracy == null || c.altitudeAccuracy < 30)) {
    currentAltitude = c.altitude;
    if (lastAltitude != null && lastAltTime != null) {
      const dt = (now - lastAltTime) / 1000;
      const dAlt = currentAltitude - lastAltitude;
      if (dt > 0.5 && Math.abs(dAlt) > 0.5) {
        ascentRate = (dAlt / dt) * 60;
        if (dAlt > 1) totalClimb += dAlt;
        else if (dAlt < -1) totalDescent += Math.abs(dAlt);
      }
    }
    lastAltitude = currentAltitude;
    lastAltTime = now;
  }

  updateUI();
  $('status').textContent = 'GPS active • accuracy ' + Math.round(c.accuracy) + 'm' +
    (c.altitude != null ? ' • alt ' + Math.round(c.altitude) + 'm' : '');
}

function onPosError(err) {
  $('status').textContent = 'GPS: ' + err.message;
}

async function enableSensors() {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm !== 'granted') {
        $('status').textContent = 'Orientation permission denied';
        return;
      }
    } catch (e) {
      $('status').textContent = 'Orientation permission error';
      return;
    }
  }

  window.addEventListener('deviceorientation', onOrientation, true);

  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(onPosition, onPosError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 10000
    });
  } else {
    $('status').textContent = 'Geolocation not supported';
  }

  $('permBtn').classList.add('hidden');
  $('status').textContent = 'Hold still, then tap Reset / Calibrate to set zero';
}

function resetAll() {
  if (hasOrientation) {
    calPitch = rawPitch;
    calRoll = rawRoll;
  } else {
    calPitch = calRoll = 0;
  }

  maxPitch = maxRoll = 0;
  maxSpeed = 0;
  totalDistance = 0;
  lastPos = null;
  currentSpeed = 0;

  totalClimb = 0;
  totalDescent = 0;
  ascentRate = 0;
  lastAltitude = currentAltitude;
  lastAltTime = Date.now();

  updateUI();
  $('status').textContent = hasOrientation
    ? 'Calibrated • variation from this point • climb/descent reset'
    : 'No orientation data yet — enable sensors first';
}

$('permBtn').addEventListener('click', enableSensors);
$('resetBtn').addEventListener('click', resetAll);

updateUI();
</script>
</body>
</html>
