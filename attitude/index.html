<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offroad Attitude & Speed</title>
<style>
  :root {
    --bg: #0a0e12;
    --card: #12181f;
    --text: #e8f0f5;
    --muted: #8aa0b0;
    --accent: #f2c14e;
    --danger: #e36a2c;
    --ok: #8eae62;
    --gauge: #f2c14e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 8px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    text-align: center;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 2px;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  .ver { text-align: center; font-size: 0.55rem; color: var(--muted); margin-bottom: 6px; }
  .gauges {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-bottom: 8px;
    gap: 4px;
  }
  .gauge-wrap {
    text-align: center;
    flex: 1;
  }
  .gauge-label {
    font-size: 0.65rem;
    color: var(--accent);
    letter-spacing: 0.8px;
    margin-top: 2px;
    font-weight: 600;
  }
  svg.gauge { width: 100%; max-width: 160px; height: auto; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .card {
    background: var(--card);
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
  }
  .label {
    font-size: 0.55rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 1px;
  }
  .value {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1;
  }
  .unit {
    font-size: 0.55rem;
    color: var(--muted);
    margin-top: 0;
  }
  .max {
    font-size: 0.6rem;
    color: var(--accent);
    margin-top: 2px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  button:active { transform: scale(0.98); }
  .status {
    text-align: center;
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 6px;
    min-height: 1em;
  }
  .perm-btn { background: var(--ok); margin-bottom: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>OFFROAD ATTITUDE</h1>
  <div class="ver">v9 · clearer icons</div>

  <button id="permBtn" class="perm-btn">Enable Sensors</button>

  <div class="gauges">
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 120 100" id="pitchGauge">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f2c14e"/>
            <stop offset="100%" stop-color="#e36a2c"/>
          </linearGradient>
        </defs>
        <path d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
        <path id="pitchArc" d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="125" stroke-dashoffset="62"/>
        <g id="pitchIcon" transform="translate(60,58)">
          <g transform="rotate(0)" fill="none" stroke="#f2c14e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-28 2 L-24 -4 L-18 -9 L-8 -11 L10 -11 L18 -8 L24 -4 L26 0 L26 5 L-28 5 Z"/>
            <path d="M-16 -1 L-12 -8 L0 -8 L6 -4"/>
            <path d="M-20 0 L-18 2"/>
            <circle cx="-16" cy="5" r="5.5"/>
            <circle cx="14" cy="5" r="5.5"/>
            <circle cx="-16" cy="5" r="2.2" fill="#f2c14e" stroke="none"/>
            <circle cx="14" cy="5" r="2.2" fill="#f2c14e" stroke="none"/>
          </g>
        </g>
        <text x="60" y="92" text-anchor="middle" font-size="10" fill="#f2c14e" id="pitchVal">0°</text>
      </svg>
      <div class="gauge-label">PITCHING</div>
    </div>
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 120 100" id="rollGauge">
        <path d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
        <path id="rollArc" d="M20 70 A40 40 0 1 1 100 70" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="125" stroke-dashoffset="62"/>
        <g id="rollIcon" transform="translate(60,56)">
          <g transform="rotate(0)" fill="none" stroke="#f2c14e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-14 5 L-12 -3 L-8 -10 L8 -10 L12 -3 L14 5 Z"/>
            <path d="M-10 -1 L-6 -8 L6 -8 L10 -1"/>
            <rect x="-5" y="-6" width="10" height="5" rx="1"/>
            <rect x="-13" y="3" width="5" height="9" rx="1.5"/>
            <rect x="8" y="3" width="5" height="9" rx="1.5"/>
            <path d="M-3 0 L3 0"/>
            <path d="M0 -4 L0 2"/>
          </g>
        </g>
        <text x="60" y="92" text-anchor="middle" font-size="10" fill="#f2c14e" id="rollVal">0°</text>
      </svg>
      <div class="gauge-label">ROLLING</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Pitch max</div>
      <div class="value" id="maxPitch">0</div>
      <div class="unit">°</div>
    </div>
    <div class="card">
      <div class="label">Roll max</div>
      <div class="value" id="maxRoll">0</div>
      <div class="unit">°</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Speed</div>
      <div class="value" id="speed">0</div>
      <div class="unit">km/h</div>
      <div class="max" id="maxSpeed">max 0</div>
    </div>
    <div class="card">
      <div class="label">Distance</div>
      <div class="value" id="distance">0</div>
      <div class="unit">km</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Altitude</div>
      <div class="value" id="altitude">0</div>
      <div class="unit">m</div>
    </div>
    <div class="card">
      <div class="label">Ascent rate</div>
      <div class="value" id="ascentRate">0</div>
      <div class="unit">m/min</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Total climb</div>
      <div class="value" id="totalClimb">0</div>
      <div class="unit">m</div>
    </div>
    <div class="card">
      <div class="label">Total descent</div>
      <div class="value" id="totalDescent">0</div>
      <div class="unit">m</div>
    </div>
  </div>

  <button id="resetBtn">Reset / Calibrate</button>
  <div class="status" id="status">Tap Enable Sensors to start</div>

<script>
const $ = id => document.getElementById(id);

let maxPitch = 0, maxRoll = 0;
let maxSpeed = 0;
let totalDistance = 0;
let lastPos = null;
let watchId = null;

let calPitch = 0, calRoll = 0;
let rawPitch = 0, rawRoll = 0;
let hasMotion = false;
let currentSpeed = 0;

let currentAltitude = 0;
let ascentRate = 0;
let totalClimb = 0;
let totalDescent = 0;
let lastAltitude = null;
let lastAltTime = null;

let lastUIUpdate = 0;

function format(n) {
  if (n == null || isNaN(n)) return '0';
  return Math.round(n).toString();
}

function getDisplayed() {
  return {
    pitch: hasMotion ? (rawPitch - calPitch) : 0,
    roll: hasMotion ? (rawRoll - calRoll) : 0
  };
}

function updateGauge(type, deg) {
  const clamped = Math.max(-45, Math.min(45, deg));
  const icon = $(type + 'Icon');
  if (icon) icon.setAttribute('transform', `translate(60,${type==='pitch'?58:56}) rotate(${clamped})`);
  const val = $(type + 'Val');
  if (val) val.textContent = format(deg) + '°';
  const arc = $(type + 'Arc');
  if (arc) {
    const offset = 62 - (clamped / 45) * 30;
    arc.setAttribute('stroke-dashoffset', offset);
  }
}

function updateUI() {
  const d = getDisplayed();
  updateGauge('pitch', d.pitch);
  updateGauge('roll', d.roll);
  $('maxPitch').textContent = format(maxPitch);
  $('maxRoll').textContent = format(maxRoll);
  $('speed').textContent = format(currentSpeed);
  $('maxSpeed').textContent = 'max ' + format(maxSpeed);
  $('distance').textContent = format(totalDistance / 1000);
  $('altitude').textContent = format(currentAltitude);
  $('ascentRate').textContent = format(ascentRate);
  $('totalClimb').textContent = format(totalClimb);
  $('totalDescent').textContent = format(totalDescent);
}

function maybeUpdateUI() {
  const now = Date.now();
  if (now - lastUIUpdate >= 1000) {
    lastUIUpdate = now;
    updateUI();
  }
}

function onMotion(e) {
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;

  const x = acc.x || 0;
  const y = acc.y || 0;
  const z = acc.z || 0;

  rawPitch = Math.atan2(y, z) * (180 / Math.PI);
  rawRoll  = Math.atan2(-x, Math.sqrt(y * y + z * z)) * (180 / Math.PI);

  hasMotion = true;

  const d = getDisplayed();
  maxPitch = Math.max(maxPitch, Math.abs(d.pitch));
  maxRoll = Math.max(maxRoll, Math.abs(d.roll));

  maybeUpdateUI();
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function onPosition(pos) {
  const c = pos.coords;
  const now = pos.timestamp || Date.now();

  currentSpeed = (c.speed != null && c.speed >= 0) ? c.speed * 3.6 : 0;
  if (currentSpeed) maxSpeed = Math.max(maxSpeed, currentSpeed);

  if (lastPos && c.accuracy < 50) {
    const dist = haversine(lastPos.latitude, lastPos.longitude, c.latitude, c.longitude);
    if (dist > 1 && dist < 200) totalDistance += dist;
  }
  lastPos = { latitude: c.latitude, longitude: c.longitude };

  if (c.altitude != null && (c.altitudeAccuracy == null || c.altitudeAccuracy < 30)) {
    currentAltitude = c.altitude;
    if (lastAltitude != null && lastAltTime != null) {
      const dt = (now - lastAltTime) / 1000;
      const dAlt = currentAltitude - lastAltitude;
      if (dt > 0.5 && Math.abs(dAlt) > 0.5) {
        ascentRate = (dAlt / dt) * 60;
        if (dAlt > 1) totalClimb += dAlt;
        else if (dAlt < -1) totalDescent += Math.abs(dAlt);
      }
    }
    lastAltitude = currentAltitude;
    lastAltTime = now;
  }

  maybeUpdateUI();
  $('status').textContent = 'GPS active • accuracy ' + Math.round(c.accuracy) + 'm' +
    (c.altitude != null ? ' • alt ' + Math.round(c.altitude) + 'm' : '');
}

function onPosError(err) {
  $('status').textContent = 'GPS: ' + err.message;
}

async function enableSensors() {
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm !== 'granted') {
        $('status').textContent = 'Motion permission denied';
        return;
      }
    } catch (e) {
      $('status').textContent = 'Motion permission error';
      return;
    }
  }

  window.addEventListener('devicemotion', onMotion, true);

  if (navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition(onPosition, onPosError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 10000
    });
  } else {
    $('status').textContent = 'Geolocation not supported';
  }

  $('permBtn').classList.add('hidden');
  $('status').textContent = 'Hold still, then tap Reset / Calibrate to set zero';
}

function resetAll() {
  if (hasMotion) {
    calPitch = rawPitch;
    calRoll = rawRoll;
  } else {
    calPitch = calRoll = 0;
  }

  maxPitch = maxRoll = 0;
  maxSpeed = 0;
  totalDistance = 0;
  lastPos = null;
  currentSpeed = 0;

  totalClimb = 0;
  totalDescent = 0;
  ascentRate = 0;
  lastAltitude = currentAltitude;
  lastAltTime = Date.now();

  lastUIUpdate = 0;
  updateUI();
  $('status').textContent = hasMotion
    ? 'Calibrated • variation from this point • climb/descent reset'
    : 'No motion data yet — enable sensors first';
}

$('permBtn').addEventListener('click', enableSensors);
$('resetBtn').addEventListener('click', resetAll);

updateUI();
</script>
</body>
</html>
