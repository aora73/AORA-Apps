<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AORA · Apps and guides</title>
<meta name="description" content="Apps, guides and fact sheets from the Australian Offroad Academy.">
<meta name="theme-color" content="#001830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AORA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --paper: #f6f3ec;
    --ink: #1c1a17;
    --muted: #5c564e;
    --line: #ddd6c8;
    --navy: #001830;
    --gold: #d04828;
    --gold-deep: #8e2c16;
  }
  * { box-sizing: border-box; }
  html { background: var(--navy); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  header {
    background: var(--navy);
    color: #f6f3ec;
    padding: calc(0.85rem + env(safe-area-inset-top)) 1.1rem 0.9rem;
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand img { height: 2.6rem; width: auto; background: #fff; }
  .brand strong { display: block; font-size: 1.15rem; letter-spacing: 0.01em; }
  .brand span { display: block; font-size: 0.8rem; opacity: 0.75; }
  .bars { margin-top: 0.85rem; }
  .bars i { display: block; height: 4px; background: var(--gold); }
  .bars b { display: block; height: 6px; background: #f6f3ec; }
  main { width: min(52rem, calc(100% - 2rem)); margin: 0 auto; padding: 1.25rem 0 3rem; }
  h1 {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 1.85rem;
    font-weight: 600;
    line-height: 1.15;
    margin: 0.2rem 0 0.35rem;
  }
  .dek { margin: 0 0 1rem; color: var(--muted); }
  label.search { display: block; }
  input {
    width: 100%;
    min-height: 2.75rem;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 1rem;
    padding: 0.55rem 0.75rem;
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .count { margin: 0.7rem 0 0; font-size: 0.8rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 0.4rem; }
  th {
    text-align: left;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0.4rem 0.5rem 0.4rem 0;
    border-bottom: 1px solid var(--line);
  }
  td { vertical-align: top; }
  td.name {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-weight: 600;
    font-size: 1.15rem;
  }
  td.about { color: var(--muted); }
  @media (max-width: 700px) { td.about { margin-top: 0.3rem; } }
  a.open {
    display: inline-flex;
    align-items: center;
    min-height: 2.75rem;
    padding: 0 0.9rem;
    background: var(--navy);
    color: #f6f3ec;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  a.open:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #empty { display: none; margin-top: 1.5rem; color: var(--muted); }
  .install {
    margin-top: 1.75rem;
    border-top: 1px solid var(--line);
    padding-top: 1rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .install strong { color: var(--ink); }
  @media (max-width: 700px) {
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    tr { display: block; padding: 1rem 0; border-bottom: 1px solid var(--line); }
    td { display: block; padding: 0; border: 0; }
    td.about { margin-top: 0.25rem; }
    td.act { margin-top: 0.65rem; }
  }
  @media (min-width: 701px) {
    td { padding: 0.95rem 0.75rem 0.95rem 0; border-bottom: 1px solid var(--line); }
    td.act { width: 5.5rem; text-align: right; padding-right: 0; }
    a.open { background: transparent; color: var(--gold-deep); padding: 0; min-height: 2.75rem; }
    a.open:hover { text-decoration: underline; }
  }
  @media (display-mode: standalone) {
    .install { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="aora-logo.png" alt="">
    <div>
      <strong>Australian Offroad Academy</strong>
      <span>Apps, guides and fact sheets</span>
    </div>
  </div>
  <div class="bars" aria-hidden="true"><i></i><b></b></div>
</header>
<main>
  <h1>Everything in one place</h1>
  <p class="dek">The live copies. Tap a row to open it.</p>
  <label class="search">
    <span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
    <input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
  </label>
  <p class="count" id="count"></p>
  <table>
    <thead>
      <tr><th>Name</th><th>What it is</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty">Nothing matches that.</p>
  <p class="install" id="install">To put <strong>AORA</strong> on your home screen, open this page in Safari, tap Share, then <strong>Add to Home Screen</strong>.</p>
</main>
<script>
const ROWS = [
  ["Rainline", "Hour-by-hour rain from five models, scored against the nearest gauge.", "https://rain-forecast.grok.me/"],
  ["Offroad Attitude & Speed", "Live pitch, roll, yaw, speed and distance with maxima.", "https://aora73.github.io/AORA-Apps/attitude/"],
  ["Drive Straya partners", "Membership fact sheet, plus the ambassadors listed by state.", "https://aora73.github.io/AORA-Apps/drive-straya/"],
  ["9 caravan experiences", "Queensland Country van guide, with a trip sketch that stays on the phone.", "https://aora73.github.io/AORA-Apps/queensland-country/"],
  ["Incident report", "Blank workplace incident report. It saves on the phone and can make a PDF.", "https://aora73.github.io/AORA-Apps/incident/"],
  ["SWM / JSA", "Safe work method and job safety analysis for a training day.", "https://aora73.github.io/AORA-Apps/swm/"],
  ["Outback Music Trail 2027", "Self-drive musical road trip, Charleville to Mount Isa, 8–22 May 2027.", "https://aora73.github.io/AORA-Apps/music-trail/"],
  ["AORA Tides", "Saturday tides for K’gari, 75 Mile Beach, 2027.", "https://aora73.github.io/AORA-Apps/tides/"],
  ["Fieldstay", "Ledger of hotels, resorts, camps and tourist parks.", "https://aora-fieldstay.grok.me/"],
  ["Airlie Parks", "Caravan parks around Airlie Beach, timed from the lagoon.", "https://airlie-parks.grok.me/"],
  ["Visitor Guides", "Index for the Paronella, Byfield and Edges pieces.", "https://aora73.github.io/aora-visitor-guides/"],
  ["Edges of the Mainland", "North, south, east, west, plus the high, the low and the centre.", "https://aora73.github.io/aora-visitor-guides/edges/"],
  ["Paronella Park fact sheet", "Gardens, night tour and van-park notes for the Cassowary Coast.", "https://aora73.github.io/aora-visitor-guides/Paronella_Park_AORA_DingoDave_Fact_Sheet.pdf"],
  ["Byfield National Park fact sheet", "Dunes, remote camping and creeks on the Capricorn Coast.", "https://aora73.github.io/aora-visitor-guides/Byfield_National_Park_AORA_DingoDave_Fact_Sheet.pdf"],
  ["Byfield field-stay review", "The stay review that sits beside the Byfield fact sheet.", "https://aora73.github.io/aora-visitor-guides/Byfield_Field_Stay_Review_AORA_DingoDave.pdf"],
  ["Dingo’s Diary", "You don’t have to conquer it. How Dingo Dave teaches.", "https://aora73.github.io/AORA-Apps/dingos-diary/"]
];
const q = document.getElementById("q");
const body = document.getElementById("rows");
function esc(s) {
  return String(s)
    .replace(/&/g, "&" + "amp;")
    .replace(/</g, "&" + "lt;")
    .replace(/>/g, "&" + "gt;")
    .replace(/"/g, "&" + "quot;")
    .replace(/'/g, "&" + "#39;");
}
function draw() {
  const needle = q.value.trim().toLowerCase();
  const shown = ROWS.filter((row) => !needle || (row[0] + " " + row[1]).toLowerCase().includes(needle));
    body.innerHTML = shown.map((row) => `<tr>\n    <td class=\"name\">${esc(row[0])}</td>\n    <td class=\"about\">${esc(row[1])}</td>\n    <td class=\"act\"><a class=\"open\" href=\"${esc(row[2])}\">Open</a></td>\n  </tr>`).join("");
  document.getElementById("count").textContent = shown.length === ROWS.length
    ? ROWS.length + " pieces"
    : shown.length + " of " + ROWS.length;
  document.getElementById("empty").style.display = shown.length ? "none" : "block";
}
q.addEventListener("input", draw);
draw();
if (window.navigator.standalone) document.getElementById("install").hidden = true;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
